<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Saving</title>

    <!-- ==========================================
         GLOBAL CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../../css/global.css">

    <link
        rel="stylesheet"
        href="../../css/navigation.css">

    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- ==========================================
         SHARED CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="shared/css/style.css">
    
    <link
        rel="stylesheet"
        href="shared/css/header.css">

    <!-- ==========================================
         SAVING CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="saving/css/home.css">

</head>

<body>

    <!-- ==========================================
         WORKSPACE
    ========================================== -->

    <main id="workspace">

        <!-- ==========================================
             HOME
        ========================================== -->

        <section
            id="home-page"
            class="page active-page">

<!-- ==========================================
     HEADER
========================================== -->

<header id="app-header">

    <div id="header-content">

        <h1 id="app-title">

            Finance Assistant

        </h1>

    </div>

<!-- ==========================================
     HEADER WAVE
========================================== -->

<div id="header-wave">

    <svg

        viewBox="0 0 1000 220"

        preserveAspectRatio="none"

    >

        <defs>

            <linearGradient

                id="waveGradient"

                x1="0%"

                y1="0%"

                x2="100%"

                y2="0%"

            >

                <stop
                    offset="0%"
                    stop-color="#FFFFFF"/>

                <stop
                    offset="20%"
                    stop-color="#F7FAFF"/>

                <stop
                    offset="45%"
                    stop-color="#EAF2FF"/>

                <stop
                    offset="70%"
                    stop-color="#BFD8FF"/>

                <stop
                    offset="100%"
                    stop-color="#2563EB"/>

            </linearGradient>

        </defs>

        <path

            fill="url(#waveGradient)"

            d="

                M0,220

                L0,220

                C220,220

                420,200

                620,145

                C760,110

                880,55

                1000,0

                L1000,220

                Z

            "

        />

    </svg>

</div>

</header>

            <!-- ==========================================
                 HERO
            ========================================== -->

            <section id="hero">

                <div id="hero-content">

                    <span id="hero-badge">

                        Saving

                    </span>

                    <h1 id="hero-title"></h1>

                    <p id="hero-description"></p>

                </div>

                <div id="hero-image">

                    <img
                        src="../../assets/images/hero/hero-saving.png"
                        alt="Hero Saving">

                </div>

            </section>

            <!-- ==========================================
                 SUMMARY
            ========================================== -->

            <section id="summary">

                <div class="section-header">

                    <span class="section-badge">

                        📊 Ringkasan

                    </span>

                </div>

                <!-- Total Saldo -->

                <div id="summary-card">

                    <p id="summary-label">

                        Total Saldo

                    </p>

                    <h2 id="summary-total">

                        Rp0

                    </h2>

                    <p id="summary-change">

                        Rp0 Bulan Ini

                    </p>

                </div>

                <!-- Daftar Penyimpanan -->

                <div id="saving-card">

                    <div id="saving-list">

                    </div>

                </div>

            </section>

            <!-- ==========================================
                 DAILY INPUT
            ========================================== -->

            <section id="daily-input">

                <div id="daily-input-header">

                    <h2>

                        Input Harian

                    </h2>

                </div>

                <div id="daily-input-card">

                </div>

            </section>

            <!-- ==========================================
                 SETTING
            ========================================== -->

            <section id="setting">

                <div id="setting-header">

                    <h2>

                        Pengaturan

                    </h2>

                </div>

                <div id="setting-card">

                </div>

            </section>

        </section>

        <!-- ==========================================
             STATISTIK
        ========================================== -->

        <section
            id="statistik-page"
            class="page hidden">

        </section>

        <!-- ==========================================
             RINGKASAN
        ========================================== -->

        <section
            id="ringkasan-page"
            class="page hidden">

        </section>

        <!-- ==========================================
             PROFILE
        ========================================== -->

        <section
            id="profile-page"
            class="page hidden">

        </section>

    </main>

    <!-- ==========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav id="bottom-navigation">

    </nav>

    <!-- ==========================================
         Global Navogation
    ========================================== -->

    <script
    type="module"
    src="saving/js/home.js">
</script>

<script
    type="module"
    src="../../js/navigation.js">
</script>
    
</body>

</html>
