<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Saving</title>

    <!-- ==========================================
         GLOBAL CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../../css/global.css">

    <link
        rel="stylesheet"
        href="../../css/navigation.css">

    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- ==========================================
         SHARED CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="shared/css/style.css">

    <!-- ==========================================
         SAVING CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="saving/css/home.css">

</head>

<body>

    <!-- ==========================================
         WORKSPACE
    ========================================== -->

    <main id="workspace">

        <!-- ==========================================
             HOME
        ========================================== -->

        <section
            id="home-page"
            class="page active-page">

            <!-- ==========================================
                 HERO
            ========================================== -->

            <section id="hero">

                <div id="hero-content">

                    <span id="hero-badge">

                        Saving

                    </span>

                    <h1 id="hero-title"></h1>

                    <p id="hero-description"></p>

                </div>

                <div id="hero-image">

                    <img
                        src="../../assets/images/hero/hero-saving.png"
                        alt="Hero Saving">

                </div>

            </section>

            <!-- ==========================================
                 SUMMARY
            ========================================== -->

            <section id="summary">

                <div class="section-header">

                    <span class="section-badge">

                        📊 Ringkasan

                    </span>

                </div>

                <!-- Total Saldo -->

                <div id="summary-card">

                    <p id="summary-label">

                        Total Saldo

                    </p>

                    <h2 id="summary-total">

                        Rp0

                    </h2>

                    <p id="summary-change">

                        Rp0 Bulan Ini

                    </p>

                </div>

                <!-- Daftar Penyimpanan -->

                <div id="saving-card">

                    <div id="saving-list">

                    </div>

                </div>

            </section>

            <!-- ==========================================
                 DAILY INPUT
            ========================================== -->

            <section id="daily-input">

                <div id="daily-input-header">

                    <h2>

                        Input Harian

                    </h2>

                </div>

                <div id="daily-input-card">

                </div>

            </section>

            <!-- ==========================================
                 SETTING
            ========================================== -->

            <section id="setting">

                <div id="setting-header">

                    <h2>

                        Pengaturan

                    </h2>

                </div>

                <div id="setting-card">

                </div>

            </section>

        </section>

        <!-- ==========================================
             STATISTIK
        ========================================== -->

        <section
            id="statistik-page"
            class="page hidden">

        </section>

        <!-- ==========================================
             RINGKASAN
        ========================================== -->

        <section
            id="ringkasan-page"
            class="page hidden">

        </section>

        <!-- ==========================================
             PROFILE
        ========================================== -->

        <section
            id="profile-page"
            class="page hidden">

        </section>

    </main>

    <!-- ==========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav id="bottom-navigation">

    </nav>

    <!-- ==========================================
         Global Navogation
    ========================================== -->

    <script
    type="module"
    src="saving/js/home.js">
</script>

<script
    type="module"
    src="../../js/navigation.js">
</script>
    
</body>

</html>
