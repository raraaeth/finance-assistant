<section

            <img

        </div>

    </section>

        class="section">

        <div class="section-header">

            <span class="section-badge">

                📊 Ringkasan

            </span>

        </div>

        ========================================== -->    
   <div
    id="summary-card"

    <p id="summary-label">

    </p>

    <h2 id="summary-total">

        Rp0

    </h2>

    <div

        <div class="summary-item">

        <div class="summary-item">

            <span>

                📉 Keluar

            <strong
                id="summary-expense">

                Rp0

            </strong>

        </div>

    </div>

</div>
    <!-- ==========================================
         DAILY INPUT
    ========================================== -->

    <section
        id="daily-input"
        class="section">

        <div class="section-header">

            <span class="section-badge">

            </span>

        </div>

        <div
            id="daily-input-card"
            class="card">

        </div>

    </section>

    <!-- ==========================================
         SETTING
    ========================================== -->

    <section
        id="setting"
        class="section">

        <div class="section-header">

            <span class="section-badge">

                ⚙️ Pengaturan

            </span>

        </div>

        <div

            class="card">

        </div>

    </section>

</section>

========================================== -->

<section

    ========================================== -->

========================================== -->

<section
    id="statistics-filter"
    class="section">

    <div class="section-header">

        <span class="section-badge">

        <div

            id="statistics-filter-list"

        >

        </div>

    </div>

</section>

    ========================================== -->

        id="statistics-chart"
        class="section">

        <div class="section-header">

            <span class="section-badge">

                📈 Grafik

            </span>

        </div>

        <div class="card">

            <canvas
                id="statistics-chart-canvas">

            </canvas>

        </div>

    </section>
