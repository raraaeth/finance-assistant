<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Saving</title>

    <!-- ==========================================
         GLOBAL CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../../css/global.css">

    <link
        rel="stylesheet"
        href="../../css/navigation.css">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- ==========================================
         SHARED CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="shared/css/style.css">

    <link
    rel="stylesheet"
    href="../../components/header/style.css">

    <!-- ==========================================
         SAVING CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="saving/css/home.css">

</head>

<body>

    <!-- ==========================================
         WORKSPACE
    ========================================== -->

    <main id="workspace">

<!-- ==========================================
     GLOBAL HEADER
========================================== -->

<div id="header-container">

</div>

        <!-- ==========================================
             HOME
        ========================================== -->

        <section
            id="home-page"
            class="page active-page">
            
<!-- ==========================================
     HOME CONTENT
========================================== -->

            <!-- ==========================================
                 HERO
            ========================================== -->

            <section id="hero">

                <div id="hero-content">

                    <h1 id="hero-title">

                    </h1>

                    <p id="hero-description">

                    </p>

                </div>

                <div id="hero-image">

                    <img
                        src="../../assets/images/hero/hero-saving.png"
                        alt="Hero Saving">

                </div>

            </section>

            <!-- ==========================================
                 SUMMARY
            ========================================== -->

            <section id="summary">

                <div class="section-header">

                    <span class="section-badge">

                        📊 Ringkasan

                    </span>

                </div>

                <!-- ==========================================
                     TOTAL SALDO
                ========================================== -->

                <div

    id="summary-card"

    class="card"

>

                    <p id="summary-label">

                        Total Saldo

                    </p>

                    <h2 id="summary-total">

                        Rp0

                    </h2>

                    <p id="summary-change">

                        Rp0 Bulan Ini

                    </p>

                </div>

                <!-- ==========================================
                     SAVING LIST
                ========================================== -->

                <div

    id="saving-card"

    class="card"

>

                    <div id="saving-list">

                    </div>

                </div>

            </section>

            <!-- ==========================================
                 DAILY INPUT
            ========================================== -->

            <section id="daily-input">

                <div id="daily-input-header">

                    <h2>

                        Input Harian

                    </h2>

                </div>

                <div id="daily-input-card">

                </div>

            </section>

            <!-- ==========================================
                 SETTING
            ========================================== -->

            <section id="setting">

                <div id="setting-header">

                    <h2>

                        Pengaturan

                    </h2>

                </div>

                <div id="setting-card">

                </div>

            </section>

        </section>

        <!-- ==========================================
             STATISTIK PAGE 
        ========================================== -->

        <section
            id="statistik-page"
            class="page hidden">

            <!-- ==========================================
                 CONTENT
            ========================================== -->

            <section id="statistik">
                
<!--==================================
    FILTER
==================================-->

<section id="statistics-filter">

    <div class="section-header">

        <h2>

            Filter

        </h2>

    </div>

    <div class="section-content">

        <div id="statistics-filter-list">

        </div>

    </div>

</section>

<!--==================================
    CHART
==================================-->

<section id="statistics-chart">

    <div class="section-header">

        <h2>

            Grafik

        </h2>

    </div>

    <div class="section-content">

        <canvas

            id="statistics-chart-canvas"

        >

        </canvas>

    </div>

</section>

<!--==================================
    TRANSACTION
==================================-->

<section id="statistics-transaction">

    <div class="section-header">

        <h2>

            Rincian Transaksi

        </h2>

    </div>

    <div class="section-content">

        <div

            id="statistics-transaction-list"

        >

        </div>

    </div>

</section>

<!--==================================
    DATA FLOW
==================================-->

<section id="statistics-flow">

    <div class="section-header">

        <h2>

            Alur Data Statistik

        </h2>

    </div>

    <div class="section-content">

        <div id="statistics-flow-card">

        </div>

    </div>

</section>

            </section>

        </section>

        <!-- ==========================================
             RINGKASAN PAGE
        ========================================== -->

        <section
            id="ringkasan-page"
            class="page hidden">

            <!-- ==========================================
                 CONTENT
            ========================================== -->

            <section id="ringkasan">

            </section>

        </section>

<!-- ==========================================
     PROFILE
========================================== -->

<section
    id="profile-page"
    class="page hidden">

</section>


    </main>

    <!-- ==========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav id="bottom-navigation">

    </nav>

    <!-- ==========================================
         HOME JS
    ========================================== -->

    <script
        type="module"
        src="saving/js/home.js">

    </script>

<!-- ==========================================
     GLOBAL HEADER
========================================== -->

<script
    type="module"
    src="../../components/header/script.js">

</script>

    <!-- ==========================================
         GLOBAL NAVIGATION
    ========================================== -->

    <script
        type="module"
        src="../../js/navigation.js">

    </script>

</body>

</html>
