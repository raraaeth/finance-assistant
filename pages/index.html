<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Finance Assistant

    </title>

    <!-- ==========================================
         GLOBAL CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="../css/global.css">

    <link
        rel="stylesheet"
        href="../css/themes/dark.css">

    <link
        rel="stylesheet"
        href="../css/themes/pink.css">

    <link
        rel="stylesheet"
        href="../css/themes/green.css">
    
    <link
        rel="stylesheet"
        href="../css/filter.css">

    <link
        rel="stylesheet"
        href="../css/navigation.css">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">

    <!-- ==========================================
         GLOBAL COMPONENT
    ========================================== -->

    <link
        rel="stylesheet"
        href="../components/header/style.css">

    <link
        rel="stylesheet"
        href="../components/overlay/style.css">

    <link
        rel="stylesheet"
        href="../components/input/style.css">

    <link
        rel="stylesheet"
        href="../components/setting/style.css">

<!-- ==========================================
     SAVING
========================================== -->

<link
    rel="stylesheet"
    href="saving/css/home.css">

<link
    rel="stylesheet"
    href="saving/css/statistics.css">

<link
    rel="stylesheet"
    href="saving/css/summary.css">    

<!-- ==========================================
     KAS
========================================== -->

<link
    rel="stylesheet"
    href="kas/css/home.css">

<link
    rel="stylesheet"
    href="kas/css/statistics.css">

<link
    rel="stylesheet"
    href="kas/css/summary.css">    

<!-- ==========================================
     PAYROLL MONTHLY
========================================== -->

<link
    rel="stylesheet"
    href="payroll-monthly/css/home.css">  

<link
    rel="stylesheet"
    href="payroll-monthly/css/statistics.css">

 <link
    rel="stylesheet"
    href="payroll-monthly/css/summary.css">   

<!-- ==========================================
     PAYROLL DAILY
========================================== -->
<link
    rel="stylesheet"
    href="payroll-daily/css/home.css">
  
<link
    rel="stylesheet"
    href="payroll-daily/css/statistics.css">

<link
    rel="stylesheet"
    href="payroll-daily/css/summary.css">

<!-- ==========================================
     FINANCIAL
========================================== -->

  
<link
    rel="stylesheet"
    href="financial/css/statistics.css">
    
        

</head>

<body>

<!-- ==========================================
     WORKSPACE
========================================== -->

<main id="workspace">

    <!-- ==========================================
         GLOBAL HEADER
    ========================================== -->

    <div id="header-container">

    </div>

    <!-- ==========================================
         HOME
    ========================================== -->

    <section
        id="home-page"
        class="page active-page">

 <!-- ==========================================
     HERO
========================================== -->

<section
    id="hero"
    class="section">

    <div id="hero-content">

        <h1 id="hero-title">

        </h1>

        <p id="hero-description">

        </p>

    </div>

    <div id="hero-image">

        <img
            id="hero-banner"
            src=""
            alt="Hero">

    </div>

</section>

<!-- ==========================================
     SUMMARY
========================================== -->

<section
    id="summary"
    class="section">

    <div class="section-header">

        <span
            id="summary-title"
            class="section-badge">

            📊 Ringkasan

        </span>

    </div>

    <div
        id="summary-card"
        class="card">

    </div>

</section>

 <!-- ==========================================
     ATTENDANCE
     (Payroll Only)
========================================== -->

<section
    id="attendance"
    class="section hidden">

    <div class="section-header">

        <span
            id="attendance-title"
            class="section-badge">

            📅 Kehadiran Bulan Ini

        </span>

    </div>

    <div
        id="attendance-card"
        class="card">

    </div>

</section>       

<!-- ==========================================
     INPUT
========================================== -->

<section
    id="input"
    class="section">

    <div class="section-header">

        <span
            id="input-title"
            class="section-badge">

            ✍️ Input

        </span>

    </div>

    <div
        id="input-card"
        class="card">

    </div>

</section>

<!-- ==========================================
     SETTING
========================================== -->

<section
    id="setting"
    class="section">

    <div class="section-header">

        <span
            id="setting-title"
            class="section-badge">

            ⚙️ Pengaturan

        </span>

    </div>

    <div
        id="setting-card"
        class="card">

    </div>

</section>     
      

    </section>

    <!-- ==========================================
         STATISTICS
    ========================================== -->

    <section
        id="statistics-page"
        class="page hidden">


<!-- ==========================================
     PAYROLL SUMMARY
     (Payroll Only)
========================================== -->

<section
    id="statistics-summary"
    class="section hidden">

    <div class="section-header">

        <span
            id="statistics-summary-title"
            class="section-badge">

            📊 Ringkasan Kehadiran

        </span>

    </div>

    <div
        id="statistics-summary-card"
        class="card">

    </div>

</section>
  

<!-- ==========================================
     FILTER
========================================== -->

<section
    id="statistics-filter"
    class="section">

    <div class="section-header">

        <span class="section-badge">

            🔍 Filter

        </span>

    </div>

    <div class="card">

        <div
            id="statistics-filter-list"
            class="filter-container">

        </div>

    </div>

</section>

<!-- ==========================================
     CHART
========================================== -->

<section
    id="statistics-chart"
    class="section">

    <div class="section-header">

        <span class="section-badge">

            📈 Grafik

        </span>

    </div>

    <div class="card">

        <canvas
            id="statistics-chart-canvas">

        </canvas>

    </div>

</section>

<!-- ==========================================
     TRANSACTION
========================================== -->

<section
    id="statistics-transaction"
    class="section">

    <div class="section-header">

        <span class="section-badge">

            📄 Rincian Transaksi

        </span>

    </div>

    <div class="card">

        <div
            id="statistics-transaction-list"
            class="list">

        </div>

        <button
            id="statistics-show-more"
            class="show-more-button">

            Tampilkan Semua

        </button>

    </div>

</section>
      

    </section>

    <!-- ==========================================
         SUMMARY
    ========================================== -->

    <section
        id="summary-page"
        class="page hidden">

 <!-- ==========================================
     OVERVIEW
========================================== -->

<section
    id="summary-overview"
    class="section">

    <div class="section-header">

        <span
            class="section-badge">

            📋 Ringkasan

        </span>

    </div>

    <div
        id="summary-overview-card"
        class="card">

    </div>

</section>

<!-- ==========================================
     DEBT
     (Kas Only)
========================================== -->

<section
    id="summary-debt"
    class="section hidden">

    <div class="section-header">

        <span
            class="section-badge">

            💳 Hutang

        </span>

    </div>

    <div
        id="summary-debt-card"
        class="card">

    </div>

</section>

<!-- ==========================================
     DISTRIBUTION
========================================== -->

<section
    id="summary-distribution"
    class="section">

    <div class="section-header">

        <span
            class="section-badge">

            🏦 Distribusi Dana

        </span>

    </div>

    <div
        id="summary-distribution-card"
        class="card">

        <canvas
            id="summary-distribution-chart">

        </canvas>

        <div
            id="summary-distribution-list">

        </div>

    </div>

</section>     

<!-- ==========================================
     PAYROLL : LAST COMPLETED PERIOD
========================================== -->

<section
    id="summary-payroll-last"
    class="section hidden">

    <div class="section-header">

        <span
            class="section-badge">

            💰 Gaji Periode Terakhir

        </span>

    </div>

    <div
        id="summary-payroll-last-card"
        class="card">

    </div>

</section>


<!-- ==========================================
     PAYROLL : CURRENT PERIOD
========================================== -->

<section
    id="summary-payroll-current"
    class="section hidden">

    <div class="section-header">

        <span
            class="section-badge">

            📅 Estimasi Gaji Bulan Ini

        </span>

    </div>

    <div
        id="summary-payroll-current-card"
        class="card">

    </div>

</section>


<!-- ==========================================
     PAYROLL : DETAIL OVERLAY
========================================== -->

<div
    id="summary-payroll-overlay"
    class="summary-payroll-overlay hidden">


    <!-- BACKDROP -->

    <div
        class="summary-payroll-overlay-backdrop"
        data-close-payroll-overlay>

    </div>


    <!-- PANEL -->

    <div
        class="summary-payroll-overlay-panel">


        <!-- HEADER -->

        <div
            class="summary-payroll-overlay-header">

            <div>

                <strong
                    id="summary-payroll-overlay-title">

                    Rincian Gaji

                </strong>

                <small
                    id="summary-payroll-overlay-period">

                </small>

            </div>


            <button
                type="button"
                id="summary-payroll-overlay-close"
                class="summary-payroll-overlay-close">

                ✕

            </button>

        </div>


        <!-- CONTENT -->

        <div
            id="summary-payroll-overlay-content"
            class="summary-payroll-overlay-content">

        </div>


    </div>

</div>


    </section>

    <!-- ==========================================
         PROFILE
    ========================================== -->

    <section
        id="profile-page"
        class="page hidden">

    </section>

</main>                

<!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->

<nav id="bottom-navigation">

</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

     APP
========================================== -->

<script
    type="module"
    src="../js/app.js">

</script>

<!-- ==========================================
     NAVIGATION
========================================== -->

<script
    type="module"
    src="../js/navigation.js">

</script>

<!-- ==========================================
     WORKSPACE
========================================== -->

<script
    type="module"
    src="../js/workspace.js">

</script>

</body>

</html>
