<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finance Assistant</title>


    <script>

        (function () {

            const path =
                window.location.pathname;


            /* =================================================
               DOCUMENTATION CLEAN ROUTE
            ================================================= */

            /*
             * GitHub Pages menampilkan 404.html
             * ketika URL clean route tidak memiliki
             * file/folder fisik.
             *
             * Simpan pathname dokumentasi,
             * kemudian kembali ke /docs/.
             */

            if (
                path.startsWith("/docs/") &&
                path !== "/docs/" &&
                path !== "/docs/index.html"
            ) {

                sessionStorage.setItem(
                    "finance-doc-path",
                    path
                );


                window.location.replace(
                    "/docs/"
                );


                return;

            }


            /* =================================================
               NEWS CLEAN ROUTE
            ================================================= */

            /*
             * News menggunakan satu index.html.
             *
             * Contoh:
             *
             * /news/artikel01
             *
             * Karena tidak ada folder/file fisik
             * bernama artikel01, GitHub Pages akan
             * masuk ke 404.html.
             *
             * Simpan pathname artikel,
             * kemudian kembali ke /news/.
             */

            if (
    path.startsWith("/news/") &&
    path !== "/news/" &&
    path !== "/news/index.html"
) {

    const newsPath =
        encodeURIComponent(
            path
        );


    window.location.replace(
        `/news/?route=${newsPath}`
    );


    return;

}


            /* =================================================
               DEFAULT 404
            ================================================= */

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    document.body.innerHTML = `

                        <main style="
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:24px;
                            box-sizing:border-box;
                            font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                            background:#f6f8fc;
                        ">

                            <div style="
                                max-width:480px;
                                width:100%;
                                text-align:center;
                            ">

                                <h1 style="
                                    margin:0 0 12px;
                                    font-size:48px;
                                ">
                                    404
                                </h1>


                                <p style="
                                    margin:0 0 24px;
                                    color:#64748b;
                                    line-height:1.6;
                                ">
                                    Halaman yang kamu cari
                                    tidak ditemukan.
                                </p>


                                <a
                                    href="/"
                                    style="
                                        display:inline-block;
                                        padding:12px 20px;
                                        border-radius:10px;
                                        background:#2563eb;
                                        color:white;
                                        text-decoration:none;
                                        font-weight:600;
                                    "
                                >
                                    Kembali ke Beranda
                                </a>

                            </div>

                        </main>

                    `;

                }
            );

        })();

    </script>

</head>


<body>

</body>

</html>
