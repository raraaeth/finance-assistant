<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finance Assistant</title>


    <script>

        (function () {

            const path =
                window.location.pathname;


            /* =================================================
               DOCUMENTATION CLEAN ROUTE
            ================================================= */

            /*
             * GitHub Pages menampilkan 404.html
             * ketika URL clean route tidak memiliki
             * file/folder fisik.
             *
             * Simpan pathname dokumentasi,
             * kemudian kembali ke /docs/.
             */

            if (
                path.startsWith("/docs/") &&
                path !== "/docs/" &&
                path !== "/docs/index.html"
            ) {

                sessionStorage.setItem(
                    "finance-doc-path",
                    path
                );


                window.location.replace(
                    "/docs/"
                );


                return;

            }


            /* =================================================
               NEWS SUDAH MIGRASI KE BLOG
            ================================================= */

            /*
             * News & Update sudah dipindahkan ke blog:
             *
             * https://blog.financeassistant.web.id/
             *
             * URL artikel lama /news/<slug>
             * diarahkan ke artikel yang sama di blog.
             * Slug yang tidak dikenal diarahkan
             * ke beranda blog.
             */

            if (
                path.startsWith("/news/")
            ) {

                const BLOG_SLUG_MAP = {
                    "pentingnya-menganalisa-pengeluaran-kecil":
                        "pentingnya-menganalisa-pengeluaran-keci",
                    "seberapa-penting-punya-penghasilan-tambahan":
                        "seberapa-penting-punya-penghasilan",
                    "cara-menghemat-gaji-agar-tidak-cepat-habis":
                        "cara-menghemat-gaji-agar-tidak-cepat",
                    "5-tips-menabung-rutin-menyisihkan-gaji-bulanan":
                        "5-tips-menabung-rutin-menyisihkan-gaji",
                    "penghasilan-besar-belum-tentu-terbebas-dari-hutang":
                        "penghasilan-besar-belum-tentu-terbebas"
                };

                const newsSlug =
                    path
                        .replace(/^\/news\//, "")
                        .replace(/\/index\.html$/, "")
                        .replace(/\/$/, "");

                let blogUrl =
                    "https://blog.financeassistant.web.id/";

                if (
                    newsSlug &&
                    !newsSlug.includes("/")
                ) {

                    if (newsSlug === "panduan-finance-assistant") {

                        blogUrl =
                            "https://blog.financeassistant.web.id/2026/10/panduan-finance-assistant.html";

                    } else {

                        const blogSlug =
                            BLOG_SLUG_MAP[newsSlug] || newsSlug;

                        blogUrl =
                            `https://blog.financeassistant.web.id/2026/11/${blogSlug}.html`;

                    }

                }


                window.location.replace(
                    blogUrl
                );


                return;

            }


            /* =================================================
               DEFAULT 404
            ================================================= */

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    document.body.innerHTML = `

                        <main style="
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:24px;
                            box-sizing:border-box;
                            font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                            background:#f6f8fc;
                        ">

                            <div style="
                                max-width:480px;
                                width:100%;
                                text-align:center;
                            ">

                                <h1 style="
                                    margin:0 0 12px;
                                    font-size:48px;
                                ">
                                    404
                                </h1>


                                <p style="
                                    margin:0 0 24px;
                                    color:#64748b;
                                    line-height:1.6;
                                ">
                                    Halaman yang kamu cari
                                    tidak ditemukan.
                                </p>


                                <a
                                    href="/"
                                    style="
                                        display:inline-block;
                                        padding:12px 20px;
                                        border-radius:10px;
                                        background:#2563eb;
                                        color:white;
                                        text-decoration:none;
                                        font-weight:600;
                                    "
                                >
                                    Kembali ke Beranda
                                </a>

                            </div>

                        </main>

                    `;

                }
            );

        })();

    </script>

</head>


<body>

</body>

</html>
