
name: Generate News Pages and Sitemap

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-news-and-sitemap:
    runs-on: ubuntu-latest

    steps:
      # ================================================
      # Checkout repository
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================
      # Setup Node.js
      # ================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================================================
      # Generate static News pages
      # ================================================

      - name: Generate News pages
        run: node js/generate-news-pages.mjs

      # ================================================
      # Generate sitemap
      # ================================================

      - name: Generate sitemap
        run: node js/generate-sitemap.mjs

      # ================================================
      # Commit generated files
      # ================================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml news/

          if git diff --cached --quiet; then
            echo "Tidak ada file hasil generator yang berubah."
          else
            git commit -m "chore: generate news pages and sitemap"
            git push
          fi
