name: Generate Sitemap


on:

  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  generate-sitemap:

    runs-on: ubuntu-latest


    steps:

      # ================================================
      # Checkout repository
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # Setup Node.js
      # ================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20


      # ================================================
      # Generate sitemap
      # ================================================

      - name: Generate sitemap
        run: node js/generate-sitemap.mjs


      # ================================================
      # Save sitemap
      # ================================================

      - name: Commit sitemap
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml


          if git diff --cached --quiet; then

            echo "Sitemap tidak berubah."

          else

            git commit -m "chore: update sitemap"

            git push

          fi
