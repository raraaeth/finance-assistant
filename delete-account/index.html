<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hapus Akun - Finance Assistant</title>

    <meta
        name="description"
        content="Halaman penghapusan akun Finance Assistant."
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b1628;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }


        .delete-container {

            width: 100%;

            max-width: 460px;

        }


        .delete-card {

            background: #111f35;

            border-radius: 20px;

            padding: 28px 22px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.25);
        }


        .logo {

            display: flex;

            justify-content: center;

            margin-bottom: 20px;
        }


        .logo img {

            width: 90px;

            height: 90px;

            object-fit: contain;

        }


        h1 {

            margin: 0 0 12px;

            text-align: center;

            font-size: 24px;

        }


        .description {

            margin: 0 0 24px;

            text-align: center;

            color: #b8c4d6;

            line-height: 1.6;

            font-size: 14px;

        }


        .account-box {

            background: #0b1628;

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 20px;

        }


        .account-label {

            display: block;

            font-size: 12px;

            color: #8fa0b8;

            margin-bottom: 6px;

        }


        .account-email {

            display: block;

            font-size: 15px;

            font-weight: 600;

            word-break: break-word;

        }


        .warning {

            background: rgba(255, 90, 90, 0.10);

            border: 1px solid rgba(255, 90, 90, 0.25);

            color: #ffb5b5;

            border-radius: 12px;

            padding: 14px;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        button {

            width: 100%;

            border: 0;

            border-radius: 12px;

            padding: 14px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        #deleteButton {

            background: #dc3545;

            color: #ffffff;

        }


        #deleteButton:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .status {

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            margin-top: 16px;

            color: #aebbd0;

        }


        .hidden {

            display: none !important;

        }


        .login-message {

            text-align: center;

            color: #b8c4d6;

            line-height: 1.6;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <main class="delete-container">


        <section class="delete-card">


            <div class="logo">

                <img
                    src="/images/logoapp.png"
                    alt="Finance Assistant"
                >

            </div>


            <h1>

                Hapus Akun

            </h1>


            <p class="description">

                Gunakan halaman ini untuk menghapus
                akun Finance Assistant.

            </p>


            <!-- ================================
                 LOGIN STATE
            ================================= -->

            <div
                id="loginMessage"
                class="login-message hidden"
            >

                Silakan login terlebih dahulu
                untuk melanjutkan penghapusan akun.

            </div>


            <!-- ================================
                 ACCOUNT STATE
            ================================= -->

            <div
                id="accountContent"
                class="hidden"
            >


                <div class="account-box">

                    <span class="account-label">

                        Akun yang sedang login

                    </span>


                    <span
                        id="accountEmail"
                        class="account-email"
                    >

                        -

                    </span>

                </div>


                <div class="warning">

                    <strong>
                        Perhatian
                    </strong>

                    <br><br>

                    Penghapusan akun merupakan tindakan
                    permanen. Setelah proses penghapusan
                    selesai, akun tidak dapat digunakan
                    kembali.

                </div>


                <button
                    id="deleteButton"
                    type="button"
                >

                    Hapus Akun

                </button>


                <div
                    id="statusMessage"
                    class="status"
                ></div>


            </div>


        </section>


    </main>


    <script
        type="module"
        src="./delete-account.js"
    ></script>


</body>

</html>
