<!-- =====================================================
     Finance Assistant
     Component    : Global Input
     File         : index.html
     Version      : 1.0.0

     Description :
     Reusable Global Input Overlay
===================================================== -->


<div
    id="global-input-overlay"
    class="global-input-overlay">


    <!-- ==========================================
         BACKDROP
    ========================================== -->

    <div
        id="global-input-backdrop"
        class="global-input-backdrop">
    </div>


    <!-- ==========================================
         PANEL
    ========================================== -->

    <div
        id="global-input-panel"
        class="global-input-panel">


        <!-- ======================================
             HEADER
        ====================================== -->

        <header
            class="global-input-header">


            <div
                class="global-input-heading">

                <h2
                    id="global-input-title">

                    Input

                </h2>

                <span
                    id="global-input-subtitle">

                    Tambahkan data

                </span>

            </div>


            <button
                type="button"
                id="global-input-close"
                class="global-input-close"
                aria-label="Tutup">

                ×

            </button>

        </header>


        <!-- ======================================
             CONTENT
        ====================================== -->

        <div
            id="global-input-content"
            class="global-input-content">


            <!-- ==================================
                 SESSION
            ================================== -->

            <section
                id="global-input-session"
                class="global-input-session">


                <!-- WORKSPACE -->

                <div
                    class="global-input-meta">

                    <span>

                        Workspace

                    </span>

                    <strong
                        id="global-input-workspace">

                        -

                    </strong>

                </div>


                <!-- ID -->

                <div
                    class="global-input-meta">

                    <span>

                        Nomor

                    </span>

                    <strong
                        id="global-input-id">

                        -

                    </strong>

                </div>


                <!-- DATE -->

                <div
                    class="global-input-meta">

                    <span>

                        Tanggal

                    </span>

                    <input
                        type="date"
                        id="global-input-date"
                        class="global-input-date">

                </div>


            </section>


            <!-- ==================================
                 DYNAMIC FORM
            ================================== -->

            <section
                id="global-input-form"
                class="global-input-form">

            </section>

             <!-- ==========================================
     ADD TRANSACTION
========================================== -->

<section
    id="global-input-action"
    class="global-input-action hidden">


    <button
        type="button"
        id="global-input-add"
        class="global-input-add">

        ＋ Tambah Transaksi

    </button>


</section>


            <!-- ==================================
                 CURRENT INPUT LIST
            ================================== -->

            <section
                id="global-input-list-section"
                class="global-input-list-section">


                <div
                    class="global-input-list-header">

                    <div>

                        <h3>

                            Input Saat Ini

                        </h3>

                        <p>

                            Data yang sudah kamu masukkan.

                        </p>

                    </div>


                    <strong
                        id="global-input-count"
                        class="global-input-count">

                        0

                    </strong>

                </div>


                <div
                    id="global-input-list"
                    class="global-input-list">

                </div>


            </section>


        </div>


        <!-- ======================================
             FOOTER
        ====================================== -->

        <footer
            id="global-input-footer"
            class="global-input-footer">


            <button
                type="button"
                id="global-input-confirm"
                class="global-input-confirm">

                Konfirmasi

            </button>


        </footer>


    </div>

</div>
